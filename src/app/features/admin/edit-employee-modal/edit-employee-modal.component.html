<ion-modal
  [isOpen]="open"
  keepContentsMounted="true"
  (willPresent)="init()"
  (didDismiss)="close()">

  <ng-template>
    <ion-header class="top">
      <ion-toolbar>
        <ion-title>Editar empleado</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="close()">
            <ion-icon [icon]="icons.close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="page">
      <ion-card class="glass" *ngIf="loading">
        <ion-card-content class="center">
          <ion-spinner name="crescent"></ion-spinner>
        </ion-card-content>
      </ion-card>

      <ion-card class="glass" *ngIf="!loading">
        <ion-card-content>
          <div class="formGrid">
            <ion-input label="Full Name" labelPlacement="stacked" [(ngModel)]="form.fullName"></ion-input>
            <ion-input label="Display Name" labelPlacement="stacked" [(ngModel)]="form.displayName"></ion-input>
            <ion-input label="Email" labelPlacement="stacked" type="email" [(ngModel)]="form.email"></ion-input>

            <ion-input label="Username" labelPlacement="stacked" [value]="form.username" readonly="true"></ion-input>
            <ion-input label="Avatar URL" labelPlacement="stacked" [value]="form.avatarUrl" readonly="true"></ion-input>
            <ion-input label="Roles" labelPlacement="stacked" [value]="(form.roles || []).join(', ')" readonly="true"></ion-input>
          </div>

          <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

          <div class="actions">
            <ion-button fill="outline" (click)="close()">Regresar</ion-button>
            <ion-button (click)="save()" [disabled]="saving || !form.fullName.trim() || !form.email.trim()">
              <ion-icon [icon]="icons.save" slot="start"></ion-icon>
              {{ saving ? 'Actualizando...' : 'Actualizar' }}
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-content>
  </ng-template>
</ion-modal>
