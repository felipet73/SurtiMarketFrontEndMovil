<ion-header class="top">
  <ion-toolbar>
    <ion-title>Admin Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <ion-card class="glass appear heroCard">
    <ion-card-content>
      <div class="cardTitle">
        <div class="titleLeft">
          <h2>Panel de configuracion</h2>
          <p class="muted">Administra productos, empleados y promociones.</p>
        </div>
        <ion-chip class="tag">Admin</ion-chip>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-card class="glass appear">
    <ion-card-content>
      <ion-list class="listGlass" inset="false">
        <ion-item class="itemGlass" button detail="true" *ngFor="let s of sections" (click)="open(s.key)">
          <ion-icon [name]="s.icon" slot="start"></ion-icon>
          <ion-label>
            <h3>{{ s.title }}</h3>
            <p>{{ s.desc }}</p>
          </ion-label>
          <ion-chip slot="end" class="tag">{{ s.badge }}</ion-chip>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>

<app-users-modal
  *ngIf="usersModalOpen"
  [open]="usersModalOpen"
  (closed)="closeUsersModal()">
</app-users-modal>

<app-products-modal-admin
  *ngIf="productsModalOpen"
  [open]="productsModalOpen"
  (closed)="closeProductsModal()">
</app-products-modal-admin>

<app-orders-modal-admin
  *ngIf="ordersModalOpen"
  [open]="ordersModalOpen"
  (closed)="closeOrdersModal()">
</app-orders-modal-admin>
