<ion-header class="top">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon [icon]="icons.back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Tabla de Grupos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="load(true)">
        <ion-icon [icon]="icons.retry"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <ion-card class="glass heroCard anim-in" *ngIf="loading && !items.length">
    <ion-card-content class="center">
      <ion-spinner name="crescent"></ion-spinner>
    </ion-card-content>
  </ion-card>

  <ion-card class="glass" *ngIf="!loading && error">
    <ion-card-content class="error">
      {{ error }}
      <ion-button size="small" fill="outline" (click)="load(true)">
        <ion-icon slot="start" [icon]="icons.retry"></ion-icon>
        Reintentar
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card class="glass appear" *ngIf="!loading && !error && !items.length">
    <ion-card-content class="muted">Sin grupos para mostrar.</ion-card-content>
  </ion-card>

  <ion-card class="glass appear" *ngIf="items.length">
    <ion-card-content>
      <ion-list class="listGlass" inset="false">
        <ion-item
          class="itemGlass"
          *ngFor="let g of items"
          [class.myGroup]="isMyGroup(g)">
          <ion-label>
            <div class="row">
              <div class="rank">#{{ g.rank }}</div>
              <div class="name">{{ g.name }}</div>
              <div class="score">{{ g.score }}</div>
              <div class="delta" [class]="deltaClass(g.deltaRank)">
                <ion-icon *ngIf="g.deltaRank > 0" [icon]="icons.up"></ion-icon>
                <ion-icon *ngIf="g.deltaRank < 0" [icon]="icons.down"></ion-icon>
                <ion-icon *ngIf="g.deltaRank === 0" [icon]="icons.flat"></ion-icon>
                <span *ngIf="g.deltaRank > 0">+{{ g.deltaRank }}</span>
                <span *ngIf="g.deltaRank < 0">{{ g.deltaRank }}</span>
                <span *ngIf="g.deltaRank === 0">0</span>
              </div>
            </div>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <div class="actionsBottom" *ngIf="hasMore && !loading">
    <ion-button fill="outline" (click)="load()">Cargar más</ion-button>
  </div>

  <div class="center" *ngIf="loading && items.length">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div style="height:16px"></div>
</ion-content>
