name: CI Frontend

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular/Ionic
        run: npm run build

      # Opcional (descomentar cuando el proyecto tenga job verde estable)
      # - name: Lint
      #   run: npm run lint
      #
      # - name: Test
      #   run: npm test -- --watch=false --browsers=ChromeHeadless
