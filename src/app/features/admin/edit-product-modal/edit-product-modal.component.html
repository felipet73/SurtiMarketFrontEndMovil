<ion-modal
  [isOpen]="open"
  keepContentsMounted="true"
  (willPresent)="init()"
  (didDismiss)="close()">

  <ng-template>
    <ion-header class="top">
      <ion-toolbar>
        <ion-title>Editar producto</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="close()">
            <ion-icon [icon]="icons.close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="page">
      <ion-card class="glass">
        <ion-card-content>
          <input #imagesInput type="file" accept="image/*" multiple hidden (change)="onImagesSelected($event)" />

          <div class="imagesBlock">
            <div class="imagesHeader">
              <div class="label">Imagenes del producto</div>
              <div class="slotInfo">{{ imageIndex + 1 }} / {{ totalImageSlots }}</div>
            </div>

            <div class="carousel">
              <ion-button fill="clear" size="small" (click)="prevImage()" [disabled]="imageIndex === 0">
                <ion-icon [icon]="icons.prev"></ion-icon>
              </ion-button>

              <div class="imagePanel" *ngIf="!isAddSlot(); else addSlotTpl">
                <img class="productImage" [src]="currentImage()" />
              </div>

              <ng-template #addSlotTpl>
                <div class="addPanel">
                  <div class="addText">Agregar nuevas imagenes</div>
                  <ion-button size="small" fill="outline" (click)="triggerAddImages(imagesInput)">
                    <ion-icon [icon]="icons.add" slot="start"></ion-icon>
                    Agregar nueva
                  </ion-button>
                </div>
              </ng-template>

              <ion-button fill="clear" size="small" (click)="nextImage()" [disabled]="imageIndex >= totalImageSlots - 1">
                <ion-icon [icon]="icons.next"></ion-icon>
              </ion-button>
            </div>

            <div class="pendingInfo" *ngIf="newImageFiles.length">
              Nuevas imagenes seleccionadas: {{ newImageFiles.length }}
            </div>
          </div>

          <div class="formGrid">
            <ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="form.name"></ion-input>
            <ion-input label="Precio base" labelPlacement="stacked" type="number" [(ngModel)]="form.basePrice"></ion-input>
            <ion-input label="Stock" labelPlacement="stacked" type="number" [(ngModel)]="form.stock"></ion-input>
            <ion-textarea label="Descripcion" labelPlacement="stacked" rows="4" [(ngModel)]="form.description"></ion-textarea>

            <ion-input label="Marca" labelPlacement="stacked" [value]="product?.brand" readonly="true"></ion-input>
            <ion-input label="Categoria" labelPlacement="stacked" [value]="product?.category" readonly="true"></ion-input>
            <ion-input label="ID" labelPlacement="stacked" [value]="product?._id" readonly="true"></ion-input>
            <ion-input label="SKU" labelPlacement="stacked" [value]="product?.sku" readonly="true"></ion-input>
            <ion-input label="EcoScore" labelPlacement="stacked" [value]="product?.ecoScore" readonly="true"></ion-input>
            <ion-input label="CO2 Kg" labelPlacement="stacked" [value]="product?.co2Kg" readonly="true"></ion-input>
            <ion-input label="Tags" labelPlacement="stacked" [value]="(product?.tags || []).join(', ')" readonly="true"></ion-input>
            <ion-input label="Badges" labelPlacement="stacked" [value]="(product?.badges || []).join(', ')" readonly="true"></ion-input>
            <ion-input label="EcoCoins Enabled" labelPlacement="stacked" [value]="product?.ecoCoinsEnabled ? 'Si' : 'No'" readonly="true"></ion-input>
            <ion-input label="Max EcoCoins Discount %" labelPlacement="stacked" [value]="product?.maxEcoCoinsDiscountPercent" readonly="true"></ion-input>
            <ion-input label="Reward Activo" labelPlacement="stacked" [value]="product?.reward?.active ? 'Si' : 'No'" readonly="true"></ion-input>
            <ion-input label="Reward EcoCoins" labelPlacement="stacked" [value]="product?.reward?.costEcoCoins" readonly="true"></ion-input>
            <ion-input label="Precio efectivo" labelPlacement="stacked" [value]="product?.effectivePrice" readonly="true"></ion-input>
            <ion-input label="Creado" labelPlacement="stacked" [value]="product?.createdAt" readonly="true"></ion-input>
            <ion-input label="Actualizado" labelPlacement="stacked" [value]="product?.updatedAt" readonly="true"></ion-input>
            <ion-input label="Activo" labelPlacement="stacked" [value]="product?.isActive ? 'Si' : 'No'" readonly="true"></ion-input>
          </div>

          <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

          <div class="actions">
            <ion-button fill="outline" (click)="close()">Regresar</ion-button>
            <ion-button
              (click)="save()"
              [disabled]="saving || !form.name.trim() || form.basePrice < 0 || form.stock < 0">
              <ion-icon [icon]="icons.save" slot="start"></ion-icon>
              {{ saving ? 'Guardando...' : 'Guardar' }}
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-content>
  </ng-template>
</ion-modal>
