<ion-modal
  [isOpen]="open"
  keepContentsMounted="true"
  (willPresent)="init()"
  (didDismiss)="close()">

  <ng-template>
    <ion-header class="top">
      <ion-toolbar>
        <ion-title>Crear producto</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="close()">
            <ion-icon [icon]="icons.close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="page">
      <ion-card class="glass">
        <ion-card-content>
          <div class="formGrid">
            <ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="form.name"></ion-input>
            <ion-input label="Marca" labelPlacement="stacked" [(ngModel)]="form.brand"></ion-input>
            <ion-input label="Categoria" labelPlacement="stacked" [(ngModel)]="form.category"></ion-input>
            <ion-textarea label="Descripcion" labelPlacement="stacked" rows="3" [(ngModel)]="form.description"></ion-textarea>
            <ion-input label="SKU" labelPlacement="stacked" [(ngModel)]="form.sku"></ion-input>
            <ion-input label="Precio base" labelPlacement="stacked" type="number" [(ngModel)]="form.basePrice"></ion-input>
            <ion-input label="Stock" labelPlacement="stacked" type="number" [(ngModel)]="form.stock"></ion-input>
            <ion-input label="EcoScore" labelPlacement="stacked" type="number" [(ngModel)]="form.ecoScore"></ion-input>
            <ion-input label="Badges (separados por coma)" labelPlacement="stacked" [(ngModel)]="form.badgesText"></ion-input>

            <ion-toggle [(ngModel)]="form.ecoCoinsEnabled">EcoCoins habilitado</ion-toggle>
            <ion-input
              label="Max descuento EcoCoins (0-1)"
              labelPlacement="stacked"
              type="number"
              [(ngModel)]="form.maxEcoCoinsDiscountPercent">
            </ion-input>

            <ion-toggle [(ngModel)]="form.promoActive">Promo activa</ion-toggle>
            <ion-input label="Precio promo" labelPlacement="stacked" type="number" [(ngModel)]="form.promoPrice"></ion-input>

            <ion-toggle [(ngModel)]="form.rewardActive">Reward activo</ion-toggle>
            <ion-input label="Costo en EcoCoins" labelPlacement="stacked" type="number" [(ngModel)]="form.rewardCostEcoCoins"></ion-input>
          </div>

          <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

          <div class="actions">
            <ion-button fill="outline" (click)="close()">Regresar</ion-button>
            <ion-button
              (click)="save()"
              [disabled]="saving || !form.name.trim() || !form.brand.trim() || !form.category.trim() || !form.sku.trim()">
              <ion-icon [icon]="icons.save" slot="start"></ion-icon>
              {{ saving ? 'Guardando...' : 'Guardar' }}
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-content>
  </ng-template>
</ion-modal>
