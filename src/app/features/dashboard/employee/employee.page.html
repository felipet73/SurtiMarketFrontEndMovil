<ion-header class="top">
  <ion-toolbar>
    <ion-title>Employee Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon [icon]="iconLogout"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page">
  <ion-card class="glass appear">
    <ion-card-content>
      <div class="cardTitle">
        <div class="titleLeft">
          <h2>Gestionar Pedidos</h2>
          <p class="muted">Mismo flujo de pedidos que Admin.</p>
        </div>
        <ion-chip class="tag">Pedidos</ion-chip>
      </div>

      <ion-list class="listGlass" inset="false">
        <ion-item class="itemGlass" button detail="true" (click)="openOrders()">
          <ion-label>
            <h3>Abrir gestion de pedidos</h3>
            <p>Filtrar, confirmar, enviar, cancelar y ver detalle.</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>

<app-orders-modal-admin
  *ngIf="ordersModalOpen"
  [open]="ordersModalOpen"
  (closed)="closeOrders()">
</app-orders-modal-admin>
