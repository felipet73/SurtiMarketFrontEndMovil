<ion-modal
  [isOpen]="open"
  keepContentsMounted="true"
  (willPresent)="init()"
  (didDismiss)="close()">

  <ng-template>
    <ion-header class="top">
      <ion-toolbar>
        <ion-title>Buscar grupos</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="close()">
            <ion-icon [icon]="icons.close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="page">
      <ion-card class="glass searchCard">
        <ion-card-content>
          <div class="searchRow">
            <ion-icon [icon]="icons.search"></ion-icon>
            <ion-input
              [(ngModel)]="query"
              placeholder="Buscar por nombre"
              (keyup.enter)="search()"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false">
            </ion-input>
            <ion-button size="small" class="searchBtn" (click)="search()">Buscar</ion-button>
          </div>
        </ion-card-content>
      </ion-card>

      <ion-card class="glass heroCard anim-in" *ngIf="loading">
        <ion-card-content class="center">
          <ion-spinner name="crescent"></ion-spinner>
        </ion-card-content>
      </ion-card>

      <ion-card class="glass" *ngIf="!loading && errorMessage">
        <ion-card-content class="error">{{ errorMessage }}</ion-card-content>
      </ion-card>

      <ion-card class="glass appear" *ngIf="!loading && !errorMessage">
        <ion-card-content>
          <ion-list class="listGlass" inset="false">
            <ion-item class="itemGlass" *ngFor="let g of results">
              <ion-label>
                <h3>{{ g.name }}</h3>
                <p class="muted">{{ g.description || 'Grupo comunitario' }}</p>
                <div class="tags">
                  <ion-chip class="tag" *ngIf="g.memberCount !== null && g.memberCount !== undefined">
                    {{ g.memberCount }} miembros
                  </ion-chip>
                  <ion-chip class="tag" *ngIf="g.joinPolicy">{{ g.joinPolicy }}</ion-chip>
                  <ion-chip class="tag" *ngIf="g.visibility">{{ g.visibility }}</ion-chip>
                </div>
              </ion-label>

              <ion-button
                slot="end"
                class="primary"
                [disabled]="requestedIds.has(g.id)"
                (click)="requestJoin(g)">
                <ion-icon slot="start" [icon]="icons.add"></ion-icon>
                {{ requestedIds.has(g.id) ? 'Solicitado' : 'Solicitar unirse' }}
              </ion-button>
            </ion-item>
          </ion-list>

          <div class="muted" *ngIf="!results.length">No hay grupos para mostrar.</div>
        </ion-card-content>
      </ion-card>

      <div class="actions">
        <ion-button fill="outline" (click)="close()">Regresar</ion-button>
      </div>

      <div style="height:16px"></div>
    </ion-content>
  </ng-template>
</ion-modal>
