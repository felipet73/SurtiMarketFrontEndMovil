<ion-modal
  [isOpen]="open"
  keepContentsMounted="true"
  (willPresent)="init()"
  (didDismiss)="close()">

  <ng-template>
    <ion-header class="top">
      <ion-toolbar>
        <ion-title>Gestion de usuarios</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="close()">
            <ion-icon [icon]="icons.close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="page">
      <ion-card class="glass">
        <ion-card-content>
          <div class="filters">
            <div class="searchRow">
              <ion-icon [icon]="icons.search"></ion-icon>
              <ion-input
                [(ngModel)]="query"
                placeholder="Filtrar por nombre"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false">
              </ion-input>
            </div>

            <ion-select [(ngModel)]="roleFilter" interface="popover" class="roleSelect">
              <ion-select-option value="EMPLOYEE">Empleado</ion-select-option>
              <ion-select-option value="CLIENT">Cliente</ion-select-option>
            </ion-select>

            <div class="toggleRow">
              <ion-toggle [(ngModel)]="showDeleted">Mostrar eliminados</ion-toggle>
            </div>

            <ion-button
              expand="block"
              class="addBtn"
              *ngIf="roleFilter === 'EMPLOYEE'"
              (click)="openCreateEmployee()">
              Agregar empleado
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>

      <ion-card class="glass" *ngIf="loading">
        <ion-card-content class="center">
          <ion-spinner name="crescent"></ion-spinner>
        </ion-card-content>
      </ion-card>

      <ion-card class="glass" *ngIf="!loading && errorMessage">
        <ion-card-content class="error">{{ errorMessage }}</ion-card-content>
      </ion-card>

      <ion-card class="glass userCard" *ngFor="let u of filteredUsers">
        <ion-card-content>
          <div class="userTop">
            <ion-avatar class="avatar">
              <img *ngIf="u.avatarUrl; else initialsTpl" [src]="u.avatarUrl" />
              <ng-template #initialsTpl>
                <div class="initials">{{ initials(u) }}</div>
              </ng-template>
            </ion-avatar>

            <div class="userMain">
              <div class="name">{{ displayName(u) }}</div>
              <div class="mail">{{ u.email }}</div>
              <div class="meta">
                <ion-chip class="tag">{{ (u.roles || []).join(', ') }}</ion-chip>
                <ion-chip class="tag" [class.inactive]="!u.isActive">
                  {{ u.isActive ? 'Activo' : 'Inactivo' }}
                </ion-chip>
              </div>
            </div>
          </div>

          <div class="actions" *ngIf="roleFilter === 'EMPLOYEE'">
            <ion-button size="small" fill="outline" (click)="editUser(u)">
              <ion-icon [icon]="icons.edit" slot="start"></ion-icon>
              Editar
            </ion-button>
            <ion-button size="small" color="danger" fill="outline" (click)="deleteUser(u)">
              <ion-icon [icon]="icons.remove" slot="start"></ion-icon>
              Eliminar
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>

      <ion-card class="glass" *ngIf="!loading && !errorMessage && !filteredUsers.length">
        <ion-card-content class="muted">No hay usuarios para mostrar.</ion-card-content>
      </ion-card>

      <div class="footerActions">
        <ion-button fill="outline" (click)="close()">Regresar</ion-button>
      </div>
      <div style="height: 16px;"></div>
    </ion-content>
  </ng-template>
</ion-modal>

<app-edit-employee-modal
  *ngIf="editOpen"
  [open]="editOpen"
  [userId]="selectedUserId"
  (closed)="closeEditEmployee()"
  (updated)="onEmployeeSaved()">
</app-edit-employee-modal>

<app-create-employee-modal
  *ngIf="createOpen"
  [open]="createOpen"
  (closed)="closeCreateEmployee()"
  (created)="onEmployeeSaved()">
</app-create-employee-modal>
